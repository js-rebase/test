<title>Rebase Testing</title>
<link rel="stylesheet" href="./main.css">

<!--====================================================-->

<script type="module" id="script">
  const commits = await fetch(
    "https://api.github.com/repos/js-rebase/code/commits?per_page=1"
  ).then(response => response.json());

  const sha = commits[0].sha;

  const { default: rebase } = await import(
    `https://cdn.jsdelivr.net/gh/js-rebase/code@${sha}/packages/main.js`
  );

  await rebase.include.load();
</script>
